# Tooling configuration for the backend (lint + tests).
# Dependencies live in requirements*.txt (this project runs as an app, not a
# published package, so no [build-system] is needed).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is Chinese prose; line length is not meaningful there.
"app/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Header()/Path() are intentionally called in
# argument defaults; treat them as immutable so B008 does not flag them.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
